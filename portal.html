<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171B">
<meta name="robots" content="noindex">
<title>Mi proyecto · Cenzontle</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: light; --fondo: #F4EFE6; --papel: #FFFFFF; --tinta: #15171B; --gris: #4A4F57; --linea: #DDD6CA; --carbon: #15171B; --claro: #F1ECE3; --rosa: #D6006F; --rosa-t: #C4005F; --rosa-c: #FF4FA3; --muted: #B5B0A7;
  --serif: 'Libre Caslon Text', Georgia, serif; --sans: 'Libre Franklin', Arial, sans-serif; --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --fondo: #0F1114; --papel: #1A1D22; --tinta: #F1ECE3; --gris: #B5B0A7; --linea: #2E3239; --rosa-t: #FF4FA3; } }
:root[data-theme="dark"] { color-scheme: dark; --fondo: #0F1114; --papel: #1A1D22; --tinta: #F1ECE3; --gris: #B5B0A7; --linea: #2E3239; --rosa-t: #FF4FA3; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--sans); font-size: 16px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--rosa-c); outline-offset: 2px; }
.oculto { display: none !important; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--bottom) + 30px); }
.cab { background: var(--carbon); color: var(--claro); padding: calc(var(--top) + 18px) 20px 24px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 700; font-size: 20px; }
.marca img { width: 34px; height: 34px; border-radius: 9px; }
.cab small { color: var(--muted); }
.cab h1 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.15; margin: 18px 0 4px; }
.cuerpo { padding: 18px 16px 0; }
.tarjeta { background: var(--papel); border: 1px solid var(--linea); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0 0 10px; }
.nota { color: var(--gris); font-size: 14px; margin: 0; }
.barra { height: 10px; background: var(--linea); border-radius: 6px; overflow: hidden; margin: 12px 0 6px; }
.barra i { display: block; height: 100%; background: var(--rosa); border-radius: 6px; }
.cifras { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--gris); }
.cifras b { color: var(--tinta); }
.etapas { list-style: none; margin: 12px 0 0; padding: 0; }
.etapas li { display: flex; gap: 12px; position: relative; padding-bottom: 14px; color: var(--gris); }
.etapas li::before { content: ''; position: absolute; left: 10px; top: 24px; bottom: 0; width: 2px; background: var(--linea); }
.etapas li:last-child::before { display: none; }
.etapas li.ok { color: var(--tinta); }
.etapas li.ok::before { background: var(--rosa); }
.pt { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--linea); background: var(--papel); flex: none; z-index: 1; display: grid; place-items: center; }
.etapas li.ok .pt { background: var(--rosa); border-color: var(--rosa); }
.etapas li.act .pt { box-shadow: 0 0 0 5px color-mix(in srgb, var(--rosa) 25%, transparent); }
.pt svg { width: 12px; height: 12px; }
.etapas b { display: block; }
.etapas small { color: var(--gris); }
.fila { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--linea); }
.fila:first-of-type { border-top: 0; }
.fila .txt { flex: 1; min-width: 0; }
.fila b { display: block; font-size: 15px; overflow-wrap: anywhere; }
.fila small { color: var(--gris); font-size: 13px; }
.boton { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 16px; background: var(--rosa); color: #fff; width: 100%; text-align: center; text-decoration: none; display: block; cursor: pointer; }
.boton.claro { background: transparent; border: 1.5px solid var(--linea); color: var(--tinta); }
.boton.wa { background: #1B7A4A; }
.mini { border: 1px solid var(--linea); background: var(--fondo); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
.chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 12px; background: color-mix(in srgb, var(--rosa) 14%, transparent); color: var(--rosa-t); white-space: nowrap; }
.campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.campo label { font-size: 13px; font-weight: 600; color: var(--gris); }
.campo input, .campo select { width: 100%; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--linea); background: var(--papel); padding: 11px 12px; font-size: 16px; -webkit-appearance: none; appearance: none; }
.datos-pago { background: var(--fondo); border-radius: 12px; padding: 12px; margin: 10px 0; font-size: 15px; line-height: 1.6; }
.pie { text-align: center; color: var(--gris); font-size: 13px; padding: 22px 0 8px; }
.aviso { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bottom) + 24px); background: var(--carbon); color: #fff; border-radius: 12px; padding: 12px 18px; font-weight: 600; z-index: 20; max-width: 90%; text-align: center; }
.demo { background: var(--rosa-c); color: var(--carbon); text-align: center; font-size: 13px; font-weight: 700; padding: 6px; }
.cargando { padding: 80px 20px; text-align: center; color: var(--gris); }
</style>
</head>
<body>
<div class="app">
  <div class="demo oculto" id="demo">Portal de demostración: datos de ejemplo</div>
  <header class="cab"><div class="marca"><img src="icon-192.png" alt="">Cenzontle</div><div id="saludo"></div></header>
  <main class="cuerpo" id="cuerpo"><p class="cargando">Cargando tu información…</p></main>
</div>
<div class="aviso oculto" id="aviso" role="status"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyokYmvEyuhSQYRk1g-OCPanPuyRfQfOlwinBmxT9S79ATAAm-T0iES2O8GCMs24SDs/exec';
const WHATS = '2218009063';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const pesos = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: (n || 0) % 1 ? 2 : 0 }).format(n || 0);
const fISO = v => { const s = String(v || ''); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : ''; };
const fecha = s => { s = fISO(s); if (!s) return ''; const [a, m, d] = s.split('-'); return `${+d} de ${MESES[+m - 1]} de ${a}`; };
const json = (v, d) => { if (v && typeof v === 'object') return v; try { return JSON.parse(v); } catch (e) { return d; } };
const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
function avisar(t) { const a = $('aviso'); a.textContent = t; a.classList.remove('oculto'); clearTimeout(avisar.t); avisar.t = setTimeout(() => a.classList.add('oculto'), 3000); }
const params = new URLSearchParams(location.search), CODIGO = (params.get('c') || '').toUpperCase(), DEMO = params.get('demo') === '1';
let P = null;

async function api(accion, datos) {
  if (DEMO) return demo(accion, datos);
  const r = accion === 'portal' ? await fetch(`${API_URL}?accion=portal&codigo=${encodeURIComponent(CODIGO)}`)
    : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, codigo: CODIGO, datos }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'No se pudo cargar'); return j.data;
}
function calcular() {
  const pagosOk = P.pagos.filter(p => p.Estado !== 'Por confirmar');
  P.cots = P.cotizaciones.map(c => { const pag = pagosOk.filter(p => p.Folio === c.Folio && p.Tipo !== 'Mensualidad').reduce((s, p) => s + num(p.Monto), 0), total = num(c['Total aceptado']); return Object.assign({}, c, { pagado: pag, total, saldo: Math.max(0, total - pag), avance: num(c.Avance), bit: json(c['Bitácora'], []), datos: json(c.Datos, {}) }); });
  const n = P.negocio; P.mens = [];
  if (n.Soporte === 'Sí' && num(n.Mensualidad) > 0 && fISO(n['Inicio soporte'])) {
    const h = new Date(), act = new Date(h.getFullYear(), h.getMonth(), 1), i0 = new Date(fISO(n['Inicio soporte']) + 'T12:00'), desde = new Date(i0.getFullYear(), i0.getMonth(), 1);
    const fin = fISO(n['Fin soporte']) ? new Date(fISO(n['Fin soporte']) + 'T12:00') : null, hasta = fin ? new Date(Math.min(act, new Date(fin.getFullYear(), fin.getMonth(), 1))) : act;
    const deb = []; for (let x = new Date(desde); x <= hasta && deb.length < 36; x = new Date(x.getFullYear(), x.getMonth() + 1, 1)) deb.push(`${MESES[x.getMonth()]} ${x.getFullYear()}`);
    const pag = pagosOk.filter(p => p.Tipo === 'Mensualidad').reduce((s, p) => s + num(p.Monto), 0);
    P.mens = deb.slice(Math.floor(pag / num(n.Mensualidad) + 1e-6));
  }
}
function pintar() {
  const n = P.negocio, et = P.etapas || [];
  $('saludo').innerHTML = `<h1>Hola, ${esc((n.Contacto || '').split(' ')[0] || 'bienvenido')}</h1><small>${esc(n.Negocio || '')}</small>`;
  const deuda = P.cots.reduce((s, c) => s + c.saldo, 0) + P.mens.length * num(n.Mensualidad);
  let h = '';
  P.cots.forEach(c => {
    const op = (c.datos.opciones || [])['AB'.indexOf(c['Opción elegida'])] || {};
    h += `<section class="tarjeta"><h2>Tu proyecto</h2><p class="nota">${esc(op.nombre ? `Opción ${c['Opción elegida']}: ${op.nombre}` : '')}${op.items ? ` (${op.items.map(i => i.s).join(', ')})` : ''}, folio ${esc(c.Folio)}</p>
      <ol class="etapas">${et.map((e, i) => { const b = c.bit.slice().reverse().find(x => x.e === i); return `<li class="${i <= c.avance ? 'ok' : ''}${i === c.avance ? ' act' : ''}"><span class="pt">${i <= c.avance ? OK : ''}</span><div><b>${esc(e)}</b>${b ? `<small>${fecha(b.f)}${b.n ? `. ${esc(b.n)}` : ''}</small>` : ''}</div></li>`; }).join('')}</ol></section>`;
  });
  if (!P.cots.length) h += '<section class="tarjeta"><h2>Tu proyecto</h2><p class="nota">Aquí verás el avance de tu proyecto cuando aceptes tu propuesta.</p></section>';
  const pagado = P.pagos.filter(p => p.Estado !== 'Por confirmar').reduce((s, p) => s + num(p.Monto), 0);
  h += `<section class="tarjeta"><h2>Estado de cuenta</h2>${P.cots.map(c => `<div class="fila"><div class="txt"><b>${esc(c.Folio)}</b><small>Total ${pesos(c.total)}, pagado ${pesos(c.pagado)}</small><div class="barra" aria-hidden="true"><i style="width: ${c.total ? Math.min(100, Math.round(c.pagado / c.total * 100)) : 0}%"></i></div></div><span class="chip">${c.saldo > 0 ? 'Saldo ' + pesos(c.saldo) : 'Pagado'}</span></div>`).join('')}
    ${n.Soporte === 'Sí' ? `<div class="fila"><div class="txt"><b>Soporte mensual: ${pesos(num(n.Mensualidad))}</b><small>${P.mens.length ? `Pendiente: ${esc(P.mens.join(', '))}` : 'Al corriente'}${fISO(n['Fin soporte']) ? `. Termina el ${fecha(n['Fin soporte'])}` : ''}</small></div><span class="chip">${P.mens.length ? pesos(P.mens.length * num(n.Mensualidad)) : 'Al día'}</span></div>` : ''}
    <div class="cifras" style="margin-top: 8px"><span>Total pagado <b>${pesos(pagado)}</b></span><span>Por pagar <b>${pesos(deuda)}</b></span></div></section>`;
  h += `<section class="tarjeta"><h2>Tus pagos</h2>${P.pagos.length ? P.pagos.slice().reverse().map(p => `<div class="fila"><div class="txt"><b>${pesos(num(p.Monto))}, ${esc(p.Concepto || p.Tipo)}</b><small>${fecha(p.Fecha)}${p.Estado === 'Por confirmar' ? ', esperando confirmación' : ''}</small></div>${p.Documento ? `<button class="mini" data-doc="${esc(p.Documento)}">Recibo</button>` : p.Estado === 'Por confirmar' ? '<span class="chip">Por confirmar</span>' : ''}</div>`).join('') : '<p class="nota">Todavía no hay pagos.</p>'}
    ${deuda > 0 ? '<button class="boton" id="yaPague" style="margin-top: 12px">Ya hice un pago</button>' : ''}</section>`;
  const docs = P.documentos.filter(d => d.Tipo !== 'Recibo de pago');
  h += `<section class="tarjeta"><h2>Tus documentos</h2>${docs.length ? docs.slice().reverse().map(d => `<div class="fila"><div class="txt"><b>${esc(d.Nombre)}</b><small>${esc(d.Tipo)}, ${fecha(d.Fecha)}</small></div><button class="mini" data-doc="${esc(d.ID)}">Descargar</button></div>`).join('') : '<p class="nota">Aquí aparecerán tus documentos.</p>'}</section>`;
  const pg = P.pago || {};
  if (deuda > 0 && (pg.clabe || pg.banco)) h += `<section class="tarjeta"><h2>Datos para pagar</h2><div class="datos-pago">${pg.banco ? `Banco: <b>${esc(pg.banco)}</b><br>` : ''}${pg.titular ? `Titular: <b>${esc(pg.titular)}</b><br>` : ''}${pg.clabe ? `CLABE: <b>${esc(pg.clabe)}</b>` : ''}</div>${pg.clabe ? '<button class="mini" id="copClabe">Copiar CLABE</button>' : ''}${pg.nota ? `<p class="nota" style="margin-top: 10px">${esc(pg.nota)}</p>` : ''}</section>`;
  h += `<section class="tarjeta"><h2>¿Dudas?</h2><a class="boton wa" href="https://wa.me/52${WHATS}?text=${encodeURIComponent(`Hola, soy ${n.Contacto || ''} de ${n.Negocio || ''}. Tengo una duda sobre mi proyecto.`)}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></section>
    <p class="pie">Cenzontle. Adiós libreta. Tu negocio habla por ti.</p>`;
  $('cuerpo').innerHTML = h;
  document.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => descargar(b.dataset.doc, b));
  if ($('yaPague')) $('yaPague').onclick = formPago;
  if ($('copClabe')) $('copClabe').onclick = async () => { try { await navigator.clipboard.writeText(pg.clabe); avisar('CLABE copiada'); } catch (e) {} };
}
async function descargar(id, b) {
  const t = b.textContent; b.textContent = 'Abriendo…'; b.disabled = true;
  try {
    const f = await api('portalArchivo', { id }); const bin = atob(f.base64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const file = new File([u], f.nombre, { type: f.mime });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    const url = URL.createObjectURL(file), a = document.createElement('a'); a.href = url; a.download = f.nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { avisar(e.message); } finally { b.textContent = t; b.disabled = false; }
}
function formPago() {
  const ops = P.cots.filter(c => c.saldo > 0).map(c => `<option value="${esc(c.Folio)}">Proyecto ${esc(c.Folio)} (saldo ${pesos(c.saldo)})</option>`).join('') + (P.mens.length ? '<option value="MENS">Soporte mensual</option>' : '');
  const s = document.createElement('section'); s.className = 'tarjeta'; s.id = 'formP';
  s.innerHTML = `<h2>Avísanos de tu pago</h2><p class="nota" style="margin-bottom: 12px">Lo revisamos y te enviamos tu recibo.</p>
    <div class="campo"><label for="fpA">¿A qué corresponde?</label><select id="fpA">${ops}</select></div>
    <div class="campo"><label for="fpM">Monto</label><input id="fpM" inputmode="decimal"></div>
    <div class="campo"><label for="fpF">Forma de pago</label><select id="fpF"><option>Transferencia</option><option>Depósito</option><option>Efectivo</option></select></div>
    <div class="campo"><label for="fpR">Referencia o clave de rastreo (opcional)</label><input id="fpR"></div>
    <button class="boton" id="fpEnviar">Enviar aviso</button><button class="boton claro" id="fpCancel" style="margin-top: 10px">Cancelar</button>`;
  $('yaPague').replaceWith(s);
  $('fpCancel').onclick = pintar;
  $('fpEnviar').onclick = async () => {
    const m = num($('fpM').value); if (!(m > 0)) return avisar('Escribe el monto');
    const a = $('fpA').value; $('fpEnviar').disabled = true; $('fpEnviar').textContent = 'Enviando…';
    try { P = await api('portalReportarPago', { monto: m, folio: a === 'MENS' ? '' : a, tipo: a === 'MENS' ? 'Mensualidad' : 'Abono', forma: $('fpF').value, referencia: $('fpR').value, concepto: a === 'MENS' ? 'Mensualidad de soporte (reportado)' : 'Pago reportado por el cliente' }); calcular(); pintar(); avisar('¡Gracias! Te avisaremos cuando confirmemos tu pago.'); }
    catch (e) { avisar(e.message); $('fpEnviar').disabled = false; $('fpEnviar').textContent = 'Enviar aviso'; }
  };
}
// ---------- portal de demostración ----------
function demo(accion, d) {
  const h = new Date(), f = (m, dd) => new Date(h.getFullYear(), h.getMonth() - m, dd).toLocaleDateString('en-CA');
  if (!demo.P) demo.P = { negocio: { ID: 'CZ-0002', Negocio: 'Café La Esquina', Contacto: 'Jesús Ortiz', Soporte: 'Sí', Mensualidad: 450, 'Inicio soporte': f(0, 1) }, etapas: ['Propuesta aceptada', 'Anticipo recibido', 'En desarrollo', 'Revisión contigo', 'Capacitación', 'Entregado'],
    pago: { banco: 'Banco de ejemplo', titular: 'Jesús Rodrigo García Monroy', clabe: '000000000000000000', nota: 'Al pagar, avísanos aquí para enviarte tu recibo.' },
    cotizaciones: [{ Folio: 'COT-CZ-0003', Estado: 'Aceptada', 'Opción elegida': 'B', 'Total aceptado': 3200, Avance: 2, 'Bitácora': JSON.stringify([{ e: 0, f: f(1, 7) }, { e: 1, f: f(1, 8) }, { e: 2, f: f(0, 1), n: 'Ya estamos armando tu sistema' }]), Datos: JSON.stringify({ opciones: [{ nombre: 'Esencial', items: [{ s: 'Control de ingresos' }] }, { nombre: 'Completa', items: [{ s: 'Control de ingresos y gastos' }, { s: 'Reservaciones en línea' }] }] }) }],
    pagos: [{ Recibo: 'REC-CZ-0004', Fecha: f(1, 8), Folio: 'COT-CZ-0003', Concepto: 'Anticipo COT-CZ-0003', Tipo: 'Anticipo', Monto: 1600, Estado: 'Confirmado', Documento: '' }],
    documentos: [] };
  if (accion === 'portalReportarPago') demo.P.pagos.push({ Recibo: 'REC-DEMO', Fecha: h.toLocaleDateString('en-CA'), Folio: d.folio, Concepto: d.concepto, Tipo: d.tipo, Monto: d.monto, Estado: 'Por confirmar' });
  if (accion === 'portalArchivo') return Promise.reject(new Error('En la demostración no hay archivos para descargar'));
  return Promise.resolve(JSON.parse(JSON.stringify(demo.P)));
}
(async () => {
  if (DEMO) $('demo').classList.remove('oculto');
  if (!DEMO && !/^[A-Z0-9]{8}$/.test(CODIGO)) { $('cuerpo').innerHTML = '<p class="cargando">Este enlace no es válido. Pide uno nuevo por WhatsApp al 221 800 9063.</p>'; return; }
  try { P = await api('portal'); calcular(); pintar(); }
  catch (e) { $('cuerpo').innerHTML = `<p class="cargando">${esc(e.message === 'Enlace no válido' ? 'Este enlace no es válido. Pide uno nuevo por WhatsApp al 221 800 9063.' : 'No pudimos cargar tu información. Revisa tu conexión e inténtalo de nuevo.')}</p>`; }
})();
</script>
</body>
</html>
